<div *ngIf="!collapsed" class="meeting-summary-modal" [class.modal-view]="useOverviewData">
  <h2>Query Summary</h2>

  <table class="summary-table">
    <thead>
      <tr>
        <th>Category</th>
        <th>Count</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Meetings</td>
        <td>{{ totalMeetings }}</td>
      </tr>
      <tr>
        <td>Lobbyists</td>
        <td>{{ totalLobbisti }}</td>
      </tr>
      <tr>
        <td>EU comm officers</td>
        <td>{{ totalRappresentanti }}</td>
      </tr>
      <tr>
        <td>Directorates</td>
        <td>{{ totalDirezioni }}</td>
      </tr>
    </tbody>
  </table>

  <div class="button-group">
    <button *ngIf="useOverviewData" [disabled]="loading" (click)="confirmSelection()">
      <ng-container *ngIf="!loading; else loadingSpinner">Confirm</ng-container>
      <ng-template #loadingSpinner>
        <span class="spinner"></span> Loading...
      </ng-template>
    </button>    
    <button *ngIf="useOverviewData" (click)="cancelSelection()">Modify Filters</button>
  </div>
</div>
