<div id="visualization"></div>
<div class="top-controls">
  <div class="meeting-info-box" 
       [ngStyle]="{ 'background-color': activeMeetingNode?.color || '#ddd' }">
    {{ activeMeetingNode?.count ?? 0 }}
  </div>
  <div class="slider-container">
    <label for="degreeThreshold">
      Lobbyist Degree Threshold: {{ lobbyistDegreeThreshold }}
    </label>
    <input
      id="lobbyistDegreeThreshold"
      type="range"
      min="1"
      [max]="maxVisibleLobbyistDegree"
      name="lobbyistDegreeThreshold" 
      step="1"
      [value]="lobbyistDegreeThreshold" 
      (input)="updateVisualization($event)"
    />
  </div>
</div>
<div class="bottom-info-box" *ngIf="activeRepresentativeAllocations">
  <div class="rep-name">{{ activeRepresentativeAllocations.name }}</div>

  <div *ngIf="activeRepresentativeAllocations.directorates.length > 0" class="alloc-section">
    <div class="section-title">Directorates</div>
    <ul>
      <li *ngFor="let d of activeRepresentativeAllocations.directorates">
        {{ d.name }} ({{ d.startYear }} - {{ d.endYear }})
      </li>
    </ul>
  </div>

  <div *ngIf="activeRepresentativeAllocations.cabinets.length > 0" class="alloc-section">
    <div class="section-title">Cabinets</div>
    <ul>
      <li *ngFor="let c of activeRepresentativeAllocations.cabinets">
        {{ c.name }} ({{ c.startDate | date:'yyyy-MM-dd' }} → {{ c.endDate | date:'yyyy-MM-dd' }})
      </li>
    </ul>
  </div>
</div>
